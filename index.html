<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>YEN BAI SERI</title>

  <meta name="theme-color" content="#126d5a">
  <meta name="apple-mobile-web-app-title" content="YEN BAI SERI">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link
    rel="icon"
    type="image/png"
    href="/icons/icon-192.png"
  >
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/icons/icon-180.png"
  >
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/install.css">

  <script src="/install.js" defer></script>
</head>

<body>
  <header class="install-bar">
    <strong>YEN BAI SERI</strong>

    <button id="installTop" class="primary" type="button">
      ↓ Cài vào màn hình chính
    </button>
    <style>
  /* Ẩn thanh trên cùng và nút cài đặt bên ngoài */
  .install-bar {
    display: none !important;
  }

  /* Cho trang chấm công hiển thị toàn màn hình */
  #seriApp {
    height: 100vh !important;
    height: 100dvh !important;
  }
</style>
  </header>

  <iframe
    id="seriApp"
    src="https://script.google.com/macros/s/AKfycbxTWHfV-PFgAgKUBdgpODpnwDQTZw-ThYYa29GIUmkBZiCCjkZn6flWJ1HTuFlYO0d7BA/exec"
    title="Cổng nhân viên YEN BAI SERI"
    allow="fullscreen">
  </iframe>

  <dialog id="installDialog" aria-labelledby="installTitle">
    <div class="install-brand">
      <img
        src="/icons/icon-192.png"
        width="72"
        height="72"
        alt="Logo công ty"
      >

      <div>
        <strong>YEN BAI SERI</strong>
        <div>Chấm công &amp; sản phẩm</div>
      </div>
    </div>

    <h2 id="installTitle">
      Thêm YEN BAI SERI vào màn hình chính?
    </h2>

    <p id="installText">
      Mở nhanh trang chấm công bằng biểu tượng logo công ty.
    </p>

    <div id="installHelp" hidden></div>

    <p
      id="installStatus"
      role="status"
      aria-live="polite">
    </p>

    <div class="install-actions">
      <button id="installCancel" type="button">
        Hủy
      </button>

      <button id="installConfirm" class="primary" type="button">
        Cài vào màn hình chính
      </button>
    </div>
  </dialog>

  <noscript>
    Vui lòng bật JavaScript để sử dụng trang.
  </noscript>
</body>
</html>
